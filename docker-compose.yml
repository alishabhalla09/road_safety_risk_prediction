version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: roadguard_postgres
    environment:
      POSTGRES_USER: roadguard
      POSTGRES_PASSWORD: roadguard_secret
      POSTGRES_DB: roadguard_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roadguard -d roadguard_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: roadguard_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://roadguard:roadguard_secret@postgres:5432/roadguard_db
      - ENVIRONMENT=development
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/Dockerfile.frontend
    container_name: roadguard_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
